server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    location = /metrics {
        alias /usr/share/nginx/html/procurepilot.prom;
        limit_except GET { deny all; }
    }
    location / { return 404; }
}
